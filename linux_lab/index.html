<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linux & Shell Programming Lab · WSL</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    header {
      background: #111827;
      color: white;
      padding: 24px 8%;
      font-size: 1.5rem;
      font-weight: 700;
    }
    main {
      width: min(1100px, 88%);
      margin: 48px auto;
      display: grid;
      gap: 28px;
    }
    section {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
      min-height: 180px;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 1.7rem;
    }
    p {
      margin: 0;
      color: #6b7280;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>Linux &amp; Shell Programming Lab · WSL</header>

  <main>
    <section id="commands-used">
      <h2>Commands Used</h2>
      <p>Linux and shell commands used during the lab will be listed here.</p>
    </section>

    <section id="lab-programs">
      <h2>Lab Programs</h2>
      <p>Shell programming lab exercises and programs will be listed here.</p>
    </section>
  </main>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spot the Error · OS Unit I</title><link rel="stylesheet" href="../../../course.css"><style>body{font-size:19px}.game{max-width:1200px;margin:auto;padding:36px 22px 90px}.hero h1{font-size:clamp(2.7rem,5vw,5rem);margin:.2em 0}.hero p{font-size:1.25rem;line-height:1.65}.scorebar{position:sticky;top:64px;z-index:10;background:#07131ff2;border:2px solid #365e80;border-radius:15px;padding:13px 18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.score{color:#facc15;font-weight:900}.q{margin:26px 0;padding:25px;background:linear-gradient(145deg,#102b47,#091b2f);border:2px solid #3d6382;border-radius:18px}.q h2{font-size:1.4rem}.statement{font-size:1.22rem;line-height:1.6;background:#07131f;padding:18px;border-radius:12px;border-left:6px solid #facc15}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.choices button{font-size:1.05rem;padding:14px;border:2px solid #557996;border-radius:11px;background:#12304b;color:#fff;cursor:pointer;text-align:left}.choices button:hover{border-color:#facc15}.choices button.correct{background:#14532d;border-color:#86efac}.choices button.wrong{background:#7f1d1d;border-color:#fb7185}.feedback{display:none;margin-top:15px;padding:15px;border-radius:10px;background:#07131f;line-height:1.55}.feedback.show{display:block}.tag{font-size:.85rem;color:#5eead4;font-weight:900;text-transform:uppercase}.reset{padding:12px 18px;font-size:1rem;border:0;border-radius:10px;font-weight:900;cursor:pointer}@media(max-width:700px){body{font-size:17px}.choices{grid-template-columns:1fr}}</style></head><body><header class="sitebar"><a class="brand" href="../../../">CS <span>Visual</span></a><nav class="nav"><a href="../../">Operating Systems</a><a href="../">Unit I</a></nav></header><main class="game"><section class="hero"><div class="kicker">UNIT I · GAME</div><h1>🔎 Spot the Error!</h1><p>Each card contains a statement about Unit I. Something is wrong. Choose the part that makes the statement incorrect. The correct concept appears immediately after your answer.</p></section><div class="scorebar"><span><strong>25 challenges</strong> · one attempt each</span><span class="score">Score: <span id="score">0</span> / <span id="done">0</span></span><button class="reset" onclick="location.reload()">Restart Game</button></div><div id="game"></div></main><script>
const Q=[
['Computer Organization','The Control Unit performs arithmetic calculations such as addition and subtraction.',['Control Unit','arithmetic calculations','addition and subtraction','Nothing is wrong'],1,'The ALU performs arithmetic and logical operations. The Control Unit directs operations, fetches and decodes instructions, and generates control signals.'],
['CPU','Registers are slower than cache and main memory.',['Registers','slower than cache and main memory','CPU storage','Nothing is wrong'],1,'Registers are small, very high-speed storage locations inside the CPU and are faster than cache and main memory.'],
['Memory','RAM is non-volatile, while ROM is volatile.',['RAM is non-volatile','ROM is volatile','Both parts are wrong','Nothing is wrong'],2,'The statement reverses both properties: RAM is volatile and ROM is non-volatile.'],
['Memory','Cache stores frequently used data and instructions and is normally slower than main memory.',['frequently used data','instructions','slower than main memory','Nothing is wrong'],2,'Cache is high-speed memory and is faster than main memory.'],
['Architecture','A single-processor system can execute multiple user processes truly in parallel on its one general-purpose CPU.',['single-processor system','multiple user processes','truly in parallel','Nothing is wrong'],2,'With one general-purpose CPU, processes can be interleaved by scheduling, but they are not truly executing in parallel on that single CPU.'],
['Architecture','A clustered system is tightly coupled and all nodes must share one CPU.',['tightly coupled','all nodes','share one CPU','All of these are errors'],3,'Clusters consist of two or more individual systems/nodes and are loosely coupled; each node has its own processing capability.'],
['Clustering','In asymmetric clustering, all machines actively run applications and monitor one another.',['asymmetric clustering','all machines actively run applications','monitor one another','Nothing is wrong'],1,'In asymmetric clustering one machine is active while another remains in hot standby and monitors the active machine.'],
['OS Structure','In a monolithic OS, device drivers and file-system services must run outside the kernel in user mode.',['monolithic OS','device drivers and file-system services','outside the kernel in user mode','Nothing is wrong'],2,'A monolithic architecture places major OS services together in kernel mode.'],
['OS Structure','A microkernel keeps most nonessential services inside the kernel to make the kernel as large as possible.',['microkernel','nonessential services inside kernel','kernel as large as possible','Both middle ideas are wrong'],3,'A microkernel keeps only basic mechanisms in the kernel; other services such as drivers/file systems can run in user mode.'],
['OS Structure','A virtual machine is physical hardware that can run only one operating system.',['physical hardware','only one operating system','virtual machine','Both first and second are wrong'],3,'A VM is software that simulates a computer and enables multiple operating systems to share hardware under a hypervisor.'],
['Dual Mode','Normal applications execute in kernel mode with unrestricted hardware access.',['Normal applications','kernel mode','unrestricted hardware access','Both kernel mode and unrestricted access'],3,'Normal applications run in user mode with restricted access. Kernel mode is privileged.'],
['Dual Mode','In the PPT convention, mode bit 1 represents kernel mode and mode bit 0 represents user mode.',['mode bit 1 = kernel','mode bit 0 = user','Both mappings are reversed','Nothing is wrong'],2,'The Unit I material uses mode bit 1 for user mode and mode bit 0 for kernel mode.'],
['System Calls','A user application performs privileged file I/O directly without requesting the operating system.',['user application','privileged file I/O directly','without requesting the OS','The last two ideas are wrong'],3,'A user program requests protected OS services through a system call, causing execution to enter kernel mode as needed.'],
['Process','A process is simply a program stored on disk and does not represent execution.',['process','program stored on disk','does not represent execution','Both latter parts are wrong'],3,'A process is a program in execution—an execution unit managed by the operating system.'],
['Process Memory','The stack stores global and static variables, while the data section stores function return addresses.',['stack stores globals/statics','data stores return addresses','Both are swapped/wrong','Nothing is wrong'],2,'The stack holds temporary data such as local variables, parameters and return addresses; the data section contains global/static variables.'],
['PCB','The Program Counter in a PCB stores the process ID of the next process to run.',['Program Counter','process ID','next process to run','Both latter ideas are wrong'],3,'The program counter holds the address of the next instruction to execute for that process.'],
['Process States','A process waiting for an I/O event is in the Running state.',['waiting for I/O','Running state','process','Running state is the error'],3,'A process waiting for an event such as I/O completion is blocked/waiting, not running on the CPU.'],
['Memory Management','Fixed partitioning mainly causes external fragmentation because partitions change size dynamically.',['Fixed partitioning','external fragmentation','partitions change size dynamically','Both latter ideas are wrong'],3,'Fixed partitions have fixed sizes and can waste space inside an allocated partition—internal fragmentation.'],
['Memory Management','Dynamic partitioning gives every process an equal-sized fixed partition.',['Dynamic partitioning','equal-sized','fixed partition','Both latter ideas are wrong'],3,'Dynamic partitioning uses variable-sized partitions and gives a process memory according to its need; it can cause external fragmentation.'],
['Paging','Paging requires every physical frame belonging to a process to be adjacent in memory.',['Paging','physical frames','must be adjacent','must be adjacent is wrong'],3,'Paging permits a process to occupy non-contiguous physical frames.'],
['Fragmentation','External fragmentation means unused space exists inside an allocated fixed-size block.',['External fragmentation','unused space inside allocated block','fixed-size block','The definition describes internal fragmentation'],3,'Unused space inside an allocated block is internal fragmentation. External fragmentation is free space split into small non-contiguous holes.'],
['Boot','The bootloader is responsible for keeping the OS kernel permanently on disk and preventing it from entering memory.',['bootloader','kernel permanently on disk','preventing it from entering memory','Both latter ideas are wrong'],3,'The bootloader starts the chain that loads the operating system; in the boot sequence it loads the OS kernel into memory.'],
['IPC','The two fundamental IPC models are paging and segmentation.',['IPC','paging','segmentation','Paging and segmentation are not IPC models'],3,'The two fundamental IPC models in the Unit I material are shared memory and message passing.'],
['Threads','All threads in one process have their own private code section, data section and open files.',['all threads','private code/data','private open files','The shared-resource claim is wrong'],3,'Threads of the same process share code, data and OS resources such as open files; each thread has its own PC, registers and stack.'],
['Multithreading','In the many-to-one model, each user thread maps to a different kernel thread, so one blocked thread never blocks the process.',['many-to-one model','each maps to different kernel thread','blocked thread never blocks process','Both latter ideas are wrong'],3,'Many-to-one maps multiple user threads to one kernel thread. A blocking system call can block the entire process.']
];
let score=0,done=0;const root=document.getElementById('game');Q.forEach((q,qi)=>{const e=document.createElement('section');e.className='q';e.innerHTML=`<div class="tag">${q[0]} · Challenge ${qi+1}</div><h2>What is wrong here?</h2><div class="statement">“${q[1]}”</div><div class="choices"></div><div class="feedback"><strong>Correction:</strong> ${q[4]}</div>`;const box=e.querySelector('.choices');q[2].forEach((a,ai)=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(e.dataset.done)return;e.dataset.done=1;done++;if(ai===q[3]){score++;b.classList.add('correct')}else{b.classList.add('wrong');box.children[q[3]].classList.add('correct')}[...box.children].forEach(x=>x.disabled=true);e.querySelector('.feedback').classList.add('show');document.getElementById('score').textContent=score;document.getElementById('done').textContent=done};box.appendChild(b)});root.appendChild(e)});
</script></body></html>

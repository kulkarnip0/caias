<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OS Lab · CAIAS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f8fb;
      color: #1f2937;
    }
    main {
      width: min(1000px, calc(100% - 32px));
      margin: 56px auto;
      display: grid;
      gap: 24px;
    }
    section {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 32px;
      min-height: 180px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    h2 {
      margin: 0;
      font-size: 28px;
    }
  </style>
</head>
<body>
  <main>
    <section id="commands-used">
      <h2>Commands Used</h2>
    </section>

    <section id="lab-programs">
      <h2>Lab Programs</h2>
    </section>
  </main>
</body>
</html>

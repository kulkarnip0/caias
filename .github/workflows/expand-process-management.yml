name: Expand Process Management Lesson

on:
  push:
    paths:
      - '.github/workflows/expand-process-management.yml'

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand process management content
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('os/unit1/process-management/index.html')
          s = p.read_text(encoding='utf-8')

          css = '''
.deep-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:24px}.deep-card{border:2px solid var(--border);border-radius:18px;background:#12385b;padding:22px}.deep-card h3{margin:0 0 10px;color:#fff}.deep-card p,.deep-card li{color:var(--muted);line-height:1.65}.algo-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:24px}.algo{border:2px solid var(--border);border-radius:16px;background:#12385b;padding:18px}.algo .tag2{display:inline-block;background:#1d5685;color:var(--accent);border-radius:999px;padding:5px 9px;font-size:.78rem;font-weight:950;margin-bottom:8px}.algo h3{margin:4px 0 8px;font-size:1.16rem}.algo p{color:var(--muted);line-height:1.55;font-size:.98rem}.flowline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.flowline span{background:#17466f;border:1px solid #82acd0;border-radius:10px;padding:10px 12px;font-weight:850}.flowline i{font-style:normal;color:var(--accent);font-size:1.5rem}.deadlock-scene{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-top:22px}.deadproc{border:2px solid var(--danger);background:#4d2631;border-radius:16px;padding:18px}.deadproc b{color:#fff}.dead-arrow{font-size:2rem;color:var(--accent);text-align:center}.pcb-table{margin-top:20px;border:2px solid var(--border);border-radius:16px;overflow:hidden}.pcb-table table{width:100%;border-collapse:collapse}.pcb-table th,.pcb-table td{padding:13px 15px;border-bottom:1px solid #6c95b7;text-align:left}.pcb-table th{background:#1d5685}.pcb-table td{color:var(--muted)}@media(max-width:1050px){.algo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:800px){.deep-grid,.deadlock-scene,.algo-grid{grid-template-columns:1fr}.dead-arrow{transform:rotate(90deg)}}
'''
          if '.deep-grid{' not in s:
              s = s.replace('</style>', css + '\n</style>')

          insert = r'''
<section class="chapter"><div class="chapter-num">05A · PROCESS MANAGEMENT TASKS</div><h2>What exactly does the operating system manage for every process?</h2><p>Process management is more than simply starting a program. The OS must create processes, maintain information about them, decide when they run, coordinate communication and shared resources, and finally terminate them safely. These tasks keep a multiprogramming system efficient and predictable.</p><div class="deep-grid"><div class="deep-card"><h3>➕ Process Creation & Termination</h3><p>When a process is created, the OS assigns a process identifier, creates and initializes its Process Control Block, and prepares the process for execution. When the process terminates, the OS removes its PCB and releases the CPU, memory and I/O resources that had been allocated to it.</p></div><div class="deep-card"><h3>🗓️ CPU Scheduling</h3><p>Several processes may be ready at the same time, but only a limited number can use a CPU at once. The OS therefore selects processes from the ready queue so that CPU time is used efficiently and processes make progress.</p></div><div class="deep-card"><h3>💬 Inter-Process Communication</h3><p>Cooperating processes sometimes need to exchange data. The OS provides mechanisms such as shared memory and message passing so processes can communicate without directly interfering with one another.</p></div><div class="deep-card"><h3>🔐 Process Synchronization</h3><p>When multiple processes access the same shared resource, their execution must be coordinated. Synchronization ensures that shared memory or devices are accessed in a controlled and predictable manner.</p></div><div class="deep-card"><h3>⚠️ Deadlock Handling</h3><p>The OS must prevent the system from reaching a situation in which two or more processes are unable to continue because each is waiting for a resource held by another process.</p></div></div></section>

<section class="chapter"><div class="chapter-num">05B · PROCESS CONTROL BLOCK (PCB)</div><h2>The PCB is the OS record that lets a process stop and later continue.</h2><p>Every process is represented inside the operating system by a Process Control Block. The PCB stores the information required to identify the process, manage its resources and restore its execution state after a context switch.</p><div class="pcb-table"><table><tr><th>PCB field</th><th>What it tells the OS</th></tr><tr><td>Process ID (PID)</td><td>A unique identifier for the process.</td></tr><tr><td>Process State</td><td>Whether the process is New, Ready, Running, Waiting, Suspended or Terminated.</td></tr><tr><td>CPU Registers</td><td>The register values that must be restored when the process runs again.</td></tr><tr><td>Program Counter</td><td>The address of the next instruction the process should execute.</td></tr><tr><td>Memory Management Information</td><td>Information about the memory allocated to the process.</td></tr><tr><td>I/O Status Information</td><td>Information about I/O devices or operations associated with the process.</td></tr></table></div><div class="takeaway"><b>Think of the PCB like a detailed bookmark.</b> When the CPU leaves a process, the OS stores enough information in the PCB to continue from the same point later.</div></section>

<section class="chapter"><div class="chapter-num">05C · SCHEDULING ALGORITHMS</div><h2>Different algorithms answer “Who gets the CPU next?” differently.</h2><p>Once processes enter the ready queue, the scheduler chooses which one should execute. Different scheduling algorithms make this choice using different rules, so their behaviour can differ in fairness, waiting time and responsiveness.</p><div class="algo-grid"><div class="algo"><span class="tag2">FCFS</span><h3>First-Come, First-Served</h3><p>Processes execute in the order in which they arrive in the ready queue. The process that arrives first is selected first.</p><div class="flowline"><span>P1</span><i>→</i><span>P2</span><i>→</i><span>P3</span></div></div><div class="algo"><span class="tag2">SJF</span><h3>Shortest Job First</h3><p>The process with the shortest CPU burst is selected first. A shorter job can therefore run before an earlier-arriving longer job.</p><div class="flowline"><span>3 ms</span><i>→</i><span>5 ms</span><i>→</i><span>9 ms</span></div></div><div class="algo"><span class="tag2">RR</span><h3>Round Robin</h3><p>Each ready process receives a fixed time slice. If it does not finish in that time, it returns to the ready queue and another process gets a turn.</p><div class="flowline"><span>P1</span><i>→</i><span>P2</span><i>→</i><span>P3</span><i>→</i><span>P1</span></div></div><div class="algo"><span class="tag2">PRIORITY</span><h3>Priority Scheduling</h3><p>Processes are selected according to their assigned priority. A higher-priority process is chosen before a lower-priority one.</p><div class="flowline"><span>High</span><i>→</i><span>Medium</span><i>→</i><span>Low</span></div></div><div class="algo"><span class="tag2">MLQ</span><h3>Multilevel Queue</h3><p>Processes are divided into separate queues based on class or priority. Each queue may use its own scheduling algorithm.</p><div class="flowline"><span>System</span><i>→</i><span>Interactive</span><i>→</i><span>Batch</span></div></div></div></section>

<section class="chapter"><div class="chapter-num">05D · DEADLOCK HANDLING</div><h2>Deadlock means processes are waiting, but nobody can move.</h2><p>A deadlock can occur when processes depend on one another in a cycle. Each process holds a resource and waits for another resource that is currently held by another process. As a result, all of them remain stuck.</p><div class="deadlock-scene"><div class="deadproc"><b>P1</b><p>Holds the printer.<br>Waiting for the scanner.</p></div><div class="dead-arrow">⇄</div><div class="deadproc"><b>P2</b><p>Holds the scanner.<br>Waiting for the printer.</p></div></div><div class="deep-grid"><div class="deep-card"><h3>Prevention</h3><p>Design resource-allocation rules so the system does not enter a deadlock situation.</p></div><div class="deep-card"><h3>Avoidance</h3><p>Make allocation decisions carefully so the system stays in a state from which all processes can still finish.</p></div><div class="deep-card"><h3>Detection</h3><p>Allow resource allocation to proceed, but periodically check whether a deadlock has occurred.</p></div><div class="deep-card"><h3>Recovery</h3><p>If a deadlock is detected, the OS must break the cycle, for example by terminating or rolling back a process or reclaiming resources.</p></div></div></section>

<section class="chapter"><div class="chapter-num">05E · CONTEXT SWITCHING</div><h2>The CPU changes processes by saving one state and restoring another.</h2><p>Context switching is essential for multitasking. The operating system saves the current process state—such as the program counter and CPU registers—into its PCB, selects another ready process, restores that process's saved state, and then continues execution.</p><div class="flowline"><span>P1 Running</span><i>→</i><span>Save P1 state to PCB</span><i>→</i><span>Scheduler selects P2</span><i>→</i><span>Load P2 state</span><i>→</i><span>P2 Running</span></div><p>Context switching may occur when a higher-priority process becomes ready, when an interrupt occurs, or when preemptive CPU scheduling removes the currently running process from the CPU. The switch itself is overhead because the CPU spends time saving and restoring state rather than executing application instructions.</p></section>
'''
          marker = '<section class="chapter"><div class="chapter-num">06 · CPU-BOUND VS I/O-BOUND PROCESSES</div>'
          if '05A · PROCESS MANAGEMENT TASKS' not in s:
              s = s.replace(marker, insert + '\n' + marker)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit expanded lesson
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add os/unit1/process-management/index.html
          git diff --cached --quiet || git commit -m "Expand process management content from unit 1 PPT"
          git push
